# Pin the rule set explicitly. Ruff's implicit defaults broadened in 0.16
# (adding I, B, DTZ, ASYNC, ...), so without this a routine ruff bump silently
# changes what CI enforces. These are the rules that were in force before.
# Widening the selection is a deliberate change, not a side effect of an upgrade.
[lint]
select = ["E4", "E7", "E9", "F"]
